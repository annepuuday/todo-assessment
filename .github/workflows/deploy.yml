name: Deploy Todo Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 3.110.228.166 >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@3.110.228.166 << 'EOF'
            set -e

            cd ~/todo-assessment

            echo "Pulling latest code..."
            git pull origin main

            echo "Building Downstream..."
            cd downstream
            cargo build

            echo "Building Middleware..."
            cd ../middleware
            cargo build

            echo "Building Frontend..."
            cd ../frontend
            npm install
            npm run build

            echo "Deployment completed successfully."
          EOF
